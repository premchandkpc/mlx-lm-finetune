# mlx-lm LoRA fine-tuning config (mlx-lm 0.32.x schema).
# Usage: ./scripts/train.sh [this-file] [extra CLI overrides...]
# CLI flags override values from this file.
#
# This is the base recipe, sized for the bundled 52-row sample. The values below
# were MEASURED on that sample (see the `iters` and `learning_rate` notes), not
# guessed. The other presets in this directory `extends:` this file and change a
# few keys for bigger models / more data / less memory. For your own dataset,
# raise `iters` and find the rest with `make sweep`, which ranks on the
# validation split and confirms the winner on test.
# `extends:` is understood by this repo's scripts only: never pass a preset
# directly to `mlx_lm.lora --config`.
#
# Recommended SLM base models (4-bit, Apple Silicon friendly):
#   - mlx-community/Qwen2.5-0.5B-Instruct-4bit   (default below)
#   - mlx-community/Qwen3-0.6B-4bit
#   - mlx-community/SmolLM2-360M-Instruct-4bit
#   - mlx-community/Llama-3.2-1B-Instruct-4bit
#   - mlx-community/gemma-3-270m-it-4bit

# --- model / task ---
model: mlx-community/Qwen2.5-0.5B-Instruct-4bit
train: true
fine_tune_type: lora          # lora | dora | full

# --- data ---
# Directory containing train.jsonl (+ optional valid.jsonl / test.jsonl)
# produced by scripts/prepare_data.py
data: data/processed

# --- optimizer ---
optimizer: adamw
optimizer_config:
  adamw:
    weight_decay: 0.01
# Adam learning rate. NOTE: mlx-lm applies `scale` as a raw multiplier on the
# adapter update, so the effective step ~ lr x scale. The package default and
# the official example both pair scale 20 with lr 1e-5 — going to 1e-4 here
# made held-out perplexity WORSE than the base model (overfitting: train loss
# 0.009, val rising again by step 100). Verify with ./scripts/eval.sh.
learning_rate: 1e-5
# Optional LR schedule (config-file only). `arguments` are literal:
# [peak_lr, decay_steps, end_lr]. When a schedule is set, scripts/resolve_config.py
# rewrites peak_lr and decay_steps from `learning_rate` / `iters` at train time, so
# `--iters 200` or `--learning-rate 2e-5` can't leave a stale schedule behind.
# Off by default: the measurements below were made at a constant LR.
#lr_schedule:
#  name: cosine_decay
#  warmup: 50
#  warmup_init: 1e-6
#  arguments: [1e-5, 500, 1e-6]   # [peak_lr, decay_steps, end_lr]

# --- training loop ---
iters: 25                     # demo-sized: ~2 epochs over the 52-row sample.
                              # Measured (Qwen2.5-0.5B, this sample): val loss
                              # 4.465 -> 2.780 @ step 25, then rises (3.611 @50,
                              # 4.738 @100 = worse than untrained) while train
                              # loss pins at 0.009 — overfitting. Held-out test
                              # ppl agrees: 22.2 @25 vs 65.3 @50 (base 107.1).
                              # Stop at the minimum; use 500–2000 for real
                              # datasets and watch valid.jsonl loss.
batch_size: 4
val_batches: 10               # -1 = full validation set
steps_per_report: 10
steps_per_eval: 25
grad_accumulation_steps: 1    # raise to enlarge effective batch w/o more memory
grad_checkpoint: false        # true = less memory, more compute
# Loss on the assistant reply only (system+user tokens are masked out).
# Works for chat/completions data; MUST be false for `text` data —
# mlx-lm raises "Prompt masking not supported for text dataset."
mask_prompt: true

# --- LoRA adapter ---
num_layers: 16                # apply LoRA to the last N layers; -1 = all
lora_parameters:
  # NOTE: mlx-lm uses `scale` (the direct multiplier on the low-rank update),
  # NOT `alpha` as in PEFT/HF. scale ~= alpha / rank in other frameworks.
  rank: 8
  scale: 20.0
  dropout: 0.05

# --- checkpointing / eval ---
adapter_path: outputs/adapters
save_every: 25
max_seq_length: 1024
test: false                   # evaluate on test.jsonl after training
seed: 42
